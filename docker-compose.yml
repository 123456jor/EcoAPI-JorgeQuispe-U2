services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecorecicla
      POSTGRES_USER: ecorecicla
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Crea .env con scripts/configurar.ps1}
      TZ: America/Lima
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["eco_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecorecicla -d ecorecicla"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ecorecicla
      DATABASE_USER: ecorecicla
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Crea .env con scripts/configurar.ps1}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:?Configura la clave del examen en .env}
      TZ: America/Lima
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 30
volumes:
  eco_data:
